[mypy]
python_version = 3.11
check_untyped_defs = True
disallow_untyped_defs = True
ignore_missing_imports = True
no_site_packages = True
warn_unused_ignores = True

[mypy-kaggle.*]
# GPU-only module types are not part of the CPU backend boundary.
follow_imports = skip

[mypy-numpy.*]
follow_imports = skip

[mypy-scipy.*]
follow_imports = skip

[mypy-shapely.*]
follow_imports = skip
